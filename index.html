<style>
*{box-sizing:border-box}html{padding-top:env(safe-area-inset-top,0px);padding-bottom:0}body{margin:0;font-size:14px}[hidden]{display:none!important}img{max-width:100%}
/* Layout: one-screen phone app, copper-to-espresso ground, Apple dot-matrix controls */
:root{
  --ground-1:#7a5440;--ground-2:#3b261b;--ground-3:#140c08;
  --tile-1:#8f6f60;--tile-2:#4c362b;--tile-3:#1e130d;
  --ink:#fbefe3;--ink-2:rgba(251,239,227,.66);--ink-3:rgba(251,239,227,.45);
  --chip:rgba(255,235,215,.13);--line:rgba(255,240,228,.16);
  --cream:#f3e2d0;--cream-ink:#3b261b;
  --track-1:#7d5e4d;--track-2:#a67b60;
  --font:-apple-system,"SF Pro Text",system-ui,"Helvetica Neue",Arial,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;background:var(--ground-3)}
body{color:var(--ink);font-family:var(--font);-webkit-tap-highlight-color:transparent;overflow:hidden}
#app{position:relative;height:100%;max-width:440px;margin:0 auto;background:linear-gradient(165deg,var(--ground-1) 0%,var(--ground-2) 42%,var(--ground-3) 100%);display:flex;flex-direction:column;overflow:hidden}
.scr{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 24px;display:flex;flex-direction:column;align-items:center;gap:16px}
.scr[hidden]{display:none!important}
button{font-family:inherit;cursor:pointer;-webkit-user-select:none;user-select:none}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--cream);outline-offset:2px}
.ey{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.h1{font-size:28px;font-weight:600;text-align:center;text-wrap:balance;line-height:1.15}
.h2{font-size:22px;font-weight:500;text-align:center;text-wrap:balance;line-height:1.2}
.sub{font-size:14px;color:var(--ink-2);text-align:center;line-height:1.5}
.pill{font-size:15px;font-weight:500;padding:13px 26px;border-radius:999px;background:var(--cream);color:var(--cream-ink);border:none}
.pill[disabled]{opacity:.35}
.ghost{font-size:14px;padding:9px 16px;border-radius:999px;background:var(--chip);color:var(--ink);border:none}
.pk{font-size:13px;padding:6px 12px;border-radius:999px;background:var(--chip);color:var(--ink);border:none}
.pkg{display:flex;flex-direction:column;align-items:center;gap:5px}
.ps{font-size:11px;padding:3px 10px;border-radius:999px;background:transparent;color:var(--ink-3);border:1px solid var(--line)}
.ps.on{background:var(--cream);color:var(--cream-ink);border-color:transparent}
.lay{font-size:13px;padding:7px 14px;border-radius:999px;background:transparent;color:var(--ink-2);border:1px solid var(--line)}
.lay.on{background:var(--chip);color:var(--ink);border-color:rgba(255,235,215,.4)}
.lay.miss::after{content:" •";color:var(--cream)}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center}
.full{width:100%}
.card{width:100%;border-radius:26px;background:rgba(255,235,215,.07);border:1px solid var(--line);padding:18px;box-sizing:border-box}
/* tabs */
#tabs{display:flex;padding:8px max(16px,env(safe-area-inset-left,0px)) calc(8px + env(safe-area-inset-bottom,0px));gap:8px;border-top:1px solid var(--line);background:rgba(20,12,8,.6)}
#tabs button{flex:1;padding:10px;border-radius:14px;border:none;background:transparent;color:var(--ink-3);font-size:13px;font-weight:500}
#tabs button.on{background:var(--chip);color:var(--ink)}
/* check-in chrome */
.top{width:100%;display:flex;align-items:center;justify-content:space-between}
.icon{width:38px;height:38px;border-radius:50%;background:var(--chip);color:var(--ink);border:none;font-size:18px;line-height:1}
.steps{display:flex;gap:6px}.steps i{width:22px;height:3px;border-radius:2px;background:var(--line)}.steps i.on{background:var(--ink)}
.stage{position:relative;touch-action:none}
.stage canvas{display:block;width:100%;height:100%;touch-action:none}
.knob{position:absolute;width:30px;height:30px;border-radius:50%;background:#fff;pointer-events:none;opacity:0;transform:translate(-50%,-50%)}
.bub{position:absolute;transform:translate(-50%,-100%);padding:7px 14px;border-radius:999px;background:rgba(255,248,240,.96);color:var(--cream-ink);font-size:15px;font-weight:500;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .15s}
.tile{border-radius:48px;background:linear-gradient(170deg,var(--tile-1) 0%,var(--tile-2) 50%,var(--tile-3) 100%);border:1px solid rgba(255,240,228,.22)}
.cn{position:absolute;font-size:12px;font-weight:500;letter-spacing:.04em;color:rgba(255,246,236,.85);pointer-events:none}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;max-width:280px;height:46px;border-radius:999px;background:linear-gradient(90deg,var(--track-1),var(--track-2));border:1px solid rgba(255,235,215,.18);margin:0;padding:0 4px;box-sizing:border-box}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:36px;height:36px;border-radius:50%;background:#fff;border:none}
input[type=range]::-moz-range-thumb{width:36px;height:36px;border-radius:50%;background:#fff;border:none}
.ticks{width:100%;max-width:262px;display:flex;justify-content:space-between;font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.sw{width:100%;max-width:300px;height:56px;border-radius:999px;background:linear-gradient(90deg,var(--track-1),var(--track-2));border:1px solid rgba(255,235,215,.18);position:relative;padding:0}
.sw span{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;font-size:15px;font-weight:500;color:var(--ink);pointer-events:none}
.sw .kn{position:absolute;top:5px;left:5px;width:44px;height:44px;border-radius:50%;background:#fff;transition:left .25s}
.sw.on .kn{left:calc(100% - 49px)}
.mo{font-size:13px;padding:7px 14px;border-radius:999px;background:var(--chip);color:var(--ink);border:none}
.mo.on{background:var(--cream);color:var(--cream-ink)}
textarea{width:100%;max-width:340px;box-sizing:border-box;min-height:64px;border-radius:18px;background:rgba(255,235,215,.08);border:1px solid var(--line);color:var(--ink);font:15px/1.4 var(--font);padding:12px 14px;resize:none}
textarea::placeholder{color:var(--ink-3)}
/* home */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px 0;width:100%}
.cal .dn{font-size:11px;color:var(--ink-3);text-align:center;padding-bottom:4px}
.cal button{height:40px;background:none;border:none;display:flex;align-items:center;justify-content:center;padding:0;position:relative}
.cal button .d{border-radius:50%}
.cal button.sel::after{content:"";position:absolute;inset:2px;border-radius:12px;border:1px solid var(--line)}
.alert{width:100%;box-sizing:border-box;border-radius:22px;padding:14px 16px;background:rgba(255,235,215,.1);border:1px solid rgba(255,235,215,.22);font-size:14px;line-height:1.5}
.alert b{font-weight:600}
.big{font-size:44px;font-weight:500}
/* stories */
.story{position:relative;width:100%;max-width:400px;flex:1;min-height:560px;border-radius:28px;background:linear-gradient(170deg,rgba(255,235,215,.07),rgba(0,0,0,.18));border:1px solid var(--line);overflow:hidden;-webkit-user-select:none;user-select:none}
.bars{position:absolute;top:12px;left:14px;right:14px;display:flex;gap:4px;z-index:2}
.bars i{flex:1;height:2px;border-radius:2px;background:rgba(255,246,236,.22)}.bars i.on{background:rgba(255,246,236,.95)}
.sl{position:absolute;inset:0;padding:40px 18px 22px;display:none;flex-direction:column;align-items:center;gap:6px}
.sl.on{display:flex}
.sl canvas{width:100%;max-width:300px;height:auto}
.wk{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:400px}
.tag-ex{font-size:12px;padding:5px 12px;border-radius:999px;background:var(--cream);color:var(--cream-ink)}
.stats{display:flex;width:100%;margin-top:auto;padding-top:14px;border-top:1px solid var(--line)}
.stats div{flex:1;text-align:center}.stats b{display:block;font-size:20px;font-weight:500;font-variant-numeric:tabular-nums}.stats span{font-size:11px;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase}
.toast{position:absolute;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--cream);color:var(--cream-ink);padding:10px 18px;border-radius:999px;font-size:14px;font-weight:500;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;z-index:9}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <!-- HOME -->
  <section class="scr" id="home">
    <div class="ey" id="hDate"></div>
    <div class="h1" id="hTitle">Ce soir</div>
    <div id="hAlert" class="alert" hidden></div>

    <div class="card" id="hToday"></div>

    </div>

  <!-- WEEK -->

      <button class="icon" id="wNext" aria-label="Semaine suivante">›</button>
    </div>
    <div id="wEx" class="tag-ex" hidden>Exemple · remplis 3 soirs pour voir ta vraie semaine</div>
    <div class="story" id="story"></div>

  <!-- CHECK-IN STEP 1: WHEEL -->
  <section class="scr" id="s1" hidden>
    <div class="top"><button class="icon" data-close aria-label="Fermer">×</button><div class="steps"><i class="on"></i><i></i><i></i></div><span style="width:38px"></span></div>
    <div id="wPicks" class="row" style="min-height:32px"></div>

    <button class="ghost" id="wAdd">Ajouter ce mot</button>
    <input type="range" id="int" min="1" max="7" step="1" value="4" aria-label="Intensité">
    <div class="ticks"><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span></div>
    <div class="sub" id="intL" style="margin-top:-6px">Intensité 4/7 · modérée</div>
    <button class="pill" id="go2" disabled>Suivant</button>
  </section>

  <!-- STEP 2: TAGS -->
  <section class="scr" id="s2" hidden>
    <div class="top"><button class="icon" data-back="s1" aria-label="Retour">‹</button><div class="steps"><i class="on"></i><i class="on"></i><i></i></div><button class="icon" data-close aria-label="Fermer">×</button></div>
    <div style="text-align:center;min-height:52px"><div class="h2" id="tN">Qu'est-ce qui a compté ?</div><div class="sub" id="tS">Glisse sur le pad</div></div>
    <div class="stage tile" id="tagStage"><canvas id="tags" width="660" height="660" aria-label="Pad des tags" style="border-radius:48px"></canvas>
      <span class="cn" style="left:22px;top:18px">Travail</span><span class="cn" style="right:22px;top:18px">Relations</span><span class="cn" style="left:22px;bottom:18px">Corps</span><span class="cn" style="right:22px;bottom:18px">Moi</span>
      <div class="knob" id="tK" style="width:34px;height:34px"></div></div>
    <div id="tPicks" class="row" style="min-height:32px"></div>
    <button class="pill" id="go3">Suivant</button>
  </section>

  <!-- STEP 3: MOMENTS -->
  <section class="scr" id="s3" hidden>
    <div class="top"><button class="icon" data-back="s2" aria-label="Retour">‹</button><div class="steps"><i class="on"></i><i class="on"></i><i class="on"></i></div><button class="icon" data-close aria-label="Fermer">×</button></div>
    <div style="text-align:center;min-height:52px"><div class="h2" id="mN">Toute la journée</div><div class="sub" id="mS">Le ressenti couvre ta journée entière</div></div>
    <div class="row" id="lays" hidden></div>
    <button class="sw on" id="sw" aria-pressed="true"><span>Toute la journée</span><i class="kn"></i></button>
    <div class="stage" id="dialStage"><canvas id="dial" width="660" height="660" aria-label="Cadran des heures"></canvas><div class="knob" id="dK"></div></div>
    <div class="row" id="mos"></div>
    <textarea id="note" maxlength="280" placeholder="Une phrase sur ta journée (facultatif)"></textarea>
    <button class="pill" id="save">Enregistrer</button>
  </section>

  <nav id="tabs"><button id="tHome" class="on">Aujourd'hui</button><button id="tWeek">Ma semaine</button></nav>
  <div class="toast" id="toast"></div>
</div>

<script>
/* ---------- data ---------- */
const FAM=[
["Colère",[["Blessé","Embarrassé","Dévasté"],["Menacé","Insécurisé","Jaloux"],["Haineux","Amer","Défiant"],["En colère","Furieux","Enragé"],["Agressif","Provocateur","Hostile"],["Frustré","Mécontent","Irrité"],["Distant","Retiré","Suspect"],["Critique","Sceptique","Sarcastique"]]],
["Dégoût",[["Réprobation","Jugé","Aversion"],["Déception","Répugnant","Révolté"],["Terrible","Dégoût","Détestable"],["Évitement","Aversion","Hésitant"]]],
["Tristesse",[["Culpabilité","Fautif","Honteux"],["Abandon","Ignoré","Replié"],["Désespoir","Impuissant","Vulnérable"],["Dépression","Minable","Vide"],["Solitude","Abandonné","Isolé"],["Ennui","Amorphe","Indifférent"]]],
["Joie",[["Optimisme","Inspiré","Ouvert"],["Intime","Espiègle","Sensible"],["Paisible","Optimiste","Aimant"],["Fort","Provocant","Courageux"],["Accepté","Accompli","Respecté"],["Fier","Important","Curieux"],["Intéressé","Amusé","Extasié"],["Heureux","Libéré","Confiant"]]],
["Surprise",[["Excité","Énergique","Avide"],["Étonné","Effrayé","Abasourdi"],["Confus","Perplexe","Désillusionné"],["Surpris","Consterné","Choqué"]]],
["Peur",[["Apeuré","Terrifié","Craintif"],["Anxieux","Accablé","Préoccupé"],["Insécure","Incapable","Inférieur"],["Docile","Sans valeur","Insignifiant"],["Rejeté","Inadéquat","Exclus"],["Humilié","Non respecté","Ridiculisé"]]]];
const ST=-130,DA=10,rad=d=>d*Math.PI/180;
const SEG=[];FAM.forEach((f,fi)=>f[1].forEach((t,si)=>SEG.push({fi,si})));
const WORDS={};
FAM.forEach((f,fi)=>{if(!WORDS[f[0]])WORDS[f[0]]={fi,i:SEG.findIndex(s=>s.fi===fi)+Math.floor(f[1].length/2),lv:0,j:0}});
SEG.forEach((s,i)=>{const t=FAM[s.fi][1][s.si];if(!WORDS[t[0]]||WORDS[t[0]].lv===0)WORDS[t[0]]={fi:s.fi,i,lv:1,j:0};[1,2].forEach(k=>{if(!WORDS[t[k]])WORDS[t[k]]={fi:s.fi,i,lv:2,j:k-1}})});
const EM={"Colère": "😠", "Dégoût": "🤢", "Tristesse": "😢", "Joie": "😊", "Surprise": "😮", "Peur": "😟", "Blessé": "🤕", "Embarrassé": "🙈", "Dévasté": "💔", "Menacé": "⚠️", "Insécurisé": "😬", "Jaloux": "🫤", "Haineux": "👿", "Amer": "🍋", "Défiant": "😼", "En colère": "😤", "Furieux": "😡", "Enragé": "🤬", "Agressif": "👊", "Provocateur": "😏", "Hostile": "🦔", "Frustré": "😩", "Mécontent": "🙁", "Irrité": "😣", "Distant": "🧊", "Retiré": "🐢", "Suspect": "🕵️", "Critique": "🧐", "Sceptique": "🤨", "Sarcastique": "🙃", "Réprobation": "👎", "Jugé": "⚖️", "Aversion": "🙅", "Déception": "😞", "Répugnant": "🤮", "Révolté": "✊", "Terrible": "😖", "Détestable": "😾", "Évitement": "🏃", "Hésitant": "🤷", "Culpabilité": "😓", "Fautif": "🙇", "Honteux": "😳", "Abandon": "🥀", "Ignoré": "👻", "Replié": "🐚", "Désespoir": "😭", "Impuissant": "🫠", "Vulnérable": "🥺", "Dépression": "🌧️", "Minable": "😔", "Vide": "🕳️", "Solitude": "🌑", "Abandonné": "😿", "Isolé": "🏝️", "Ennui": "🥱", "Amorphe": "😪", "Indifférent": "😐", "Optimisme": "🌤️", "Inspiré": "💡", "Ouvert": "🤗", "Intime": "💞", "Espiègle": "😜", "Sensible": "🌸", "Paisible": "😌", "Optimiste": "🌈", "Aimant": "🥰", "Fort": "💪", "Provocant": "😎", "Courageux": "🦁", "Accepté": "🤝", "Accompli": "🏆", "Respecté": "🎖️", "Fier": "🦚", "Important": "⭐", "Curieux": "🔍", "Intéressé": "🤓", "Amusé": "😄", "Extasié": "🤩", "Heureux": "😁", "Libéré": "🕊️", "Confiant": "😇", "Excité": "⚡", "Énergique": "🔋", "Avide": "🔥", "Étonné": "😯", "Effrayé": "😨", "Abasourdi": "😵", "Confus": "😕", "Perplexe": "🤔", "Désillusionné": "🫥", "Surpris": "😲", "Consterné": "😦", "Choqué": "🤯", "Apeuré": "😰", "Terrifié": "😱", "Craintif": "🫣", "Anxieux": "😥", "Accablé": "😫", "Préoccupé": "💭", "Insécure": "🫨", "Incapable": "🚫", "Inférieur": "📉", "Docile": "🐑", "Sans valeur": "🫙", "Insignifiant": "🐜", "Rejeté": "🚷", "Inadéquat": "🧩", "Exclus": "🚪", "Humilié": "🥴", "Non respecté": "🙄", "Ridiculisé": "🤡"};
const ew=w=>(EM[w]||'')+' '+w;
const ART={"Colère":"la colère","Dégoût":"le dégoût","Tristesse":"la tristesse","Joie":"la joie","Surprise":"la surprise","Peur":"la peur"};
const POS_SUR=new Set(["Excité","Énergique","Avide","Étonné"]),NEU_SUR=new Set(["Surprise","Surpris"]);
const TT=[["Travail",["Charge","Réunions","Reconnaissance","Conflit","Projet","Deadline","Client","Apprentissage"]],["Relations",["Couple","Famille","Amis","Collègues","Rencontre","Dispute","Soutien","Manque"]],["Corps",["Sommeil","Sport","Santé","Alimentation","Fatigue","Alcool","Repos","Énergie"]],["Moi",["Temps pour moi","Créativité","Argent","Écrans","Nature","Sorties","Transports","Météo"]]];
const TPOS=[[1,1],[3,1],[2,2],[4,2],[1,3],[3,3],[2,4],[4,4]];
const TAGL=[];TT.forEach((t,q)=>t[1].forEach((n,k)=>{let[c,r]=TPOS[k];if(q%2)c=10-c;if(q>1)r=10-r;TAGL.push({n,th:t[0],c,r})}));
const MOM=[["Matin",6,12],["Après-midi",12,18],["Soir",18,23],["Nuit",23,30]];
const MOM_PREP={"Matin":"le matin","Après-midi":"l'après-midi","Soir":"le soir","Nuit":"la nuit"};
const MOM_PL={"Matin":"tes matinées","Après-midi":"tes fins d'après-midi","Soir":"tes soirées","Nuit":"tes nuits"};
const DAYS=["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];
const MONTHS=["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
const LIK=["très faible","faible","plutôt faible","modérée","plutôt forte","forte","très forte"];
const W='255,246,236';

/* ---------- dates ---------- */

  s=add(`<div class="ey">Tes tags</div><div class="h2">${tt.length?(low.length?'« '+tt[0][0]+' » revient<br>'+(tt[0][1]===low.length&&low.length>1?'les '+low.length+' jours difficiles':tt[0][1]+' fois les jours bas'):'Ce qui a compté :<br>« '+tt[0][0]+' »'):'Pas de tags cette semaine'}</div><div class="sub" style="margin-top:auto">${low.length?'En blanc : les tags des jours bas.':'En blanc : tes tags de la semaine.'}${tt.length>2?'<br>'+tt.slice(1,3).map(t=>t[0]).join(' et ')+' suivent de près.':''}</div>`);
  {const c=cvs(600,600);c.className='tile';c.style.borderRadius='44px';c.style.marginTop='14px';s.insertBefore(c,s.children[2]);const x=c.getContext('2d'),SP=50,M=50;
    for(let r=0;r<11;r++)for(let cc=0;cc<11;cc++){if(TAGL.some(t=>t.c===cc&&t.r===r))continue;const cr=cc===5||r===5;dot(x,M+cc*SP,M+r*SP,3.6,(cr?.7:.25)*(1-r/18))}
    TAGL.forEach(t=>{const h=tc[t.n],cx=M+t.c*SP,cy=M+t.r*SP;x.fillStyle=`rgba(255,255,255,${h?1:.3})`;x.fillRect(cx-7,cy-7,14,14);if(h){x.font=`500 19px ${FF}`;x.fillStyle=`rgba(${W},.95)`;x.textAlign='center';x.fillText(t.n+(h>1?' ×'+h:''),cx,cy+30)}})}
  // 7 signal
  const sigTag=tt.length&&low.length?tt[0][0].toLowerCase():null;
  if(best>=2){s=add(`<div class="ey">Le signal</div><div class="h2" style="margin-top:36px">${cap(DAYS[addDays(m,bs[0]).getDay()])} → ${DAYS[addDays(m,bs[1]).getDay()]}</div><div style="font-size:64px;font-weight:500;margin:14px 0 4px">${best}</div><div class="sub">jours d'affilée dans le bas${sigTag?',<br>avec « '+sigTag+' »':''}${!allDay&&low.length?',<br>surtout '+MOM_PREP[pm]:''}.</div><div class="card" style="margin-top:auto;text-align:center"><div class="ey" style="margin-bottom:8px">Pour la semaine prochaine</div><div style="font-size:18px;font-weight:500;line-height:1.4">Qu'est-ce qui pourrait alléger ${allDay?'ces journées-là':MOM_PL[pm]} ?</div></div>`)}
  else s=add(`<div class="ey">Le signal</div><div class="h2" style="margin-top:36px">Pas de série de jours bas</div><div class="sub" style="margin-top:10px">${low.length?low.length+' jour'+(low.length>1?'s':'')+' bas, mais jamais deux d\'affilée.':'Aucun jour sous la ligne neutre.'}</div><div class="card" style="margin-top:auto;text-align:center"><div class="ey" style="margin-bottom:8px">Pour la semaine prochaine</div><div style="font-size:18px;font-weight:500;line-height:1.4">Qu'est-ce que tu veux garder<br>de cette semaine ?</div></div>`);
  const bars=S.querySelector('.bars');slides.forEach(()=>bars.appendChild(document.createElement('i')))}
function showStory(){const sl=[...$('story').querySelectorAll('.sl')],bars=[...$('story').querySelectorAll('.bars i')];sl.forEach((s,k)=>s.classList.toggle('on',k===cur));bars.forEach((b,k)=>b.classList.toggle('on',k<=cur))}
$('story').addEventListener('click',e=>{if(e.target.closest('button'))return;const r=$('story').getBoundingClientRect(),n=$('story').querySelectorAll('.sl').length;cur=e.clientX-r.left<r.width/3?Math.max(0,cur-1):Math.min(n-1,cur+1);showStory()});

/* ---------- tabs & boot ---------- */
$('exp').onclick=doExport;$('imp').onclick=()=>$('impFile').click();$('impFile').onchange=e=>{const f=e.target.files[0];if(f)doImport(f);e.target.value=''};
$('tHome').onclick=()=>{renderHome();show('home')};
$('tWeek').onclick=()=>{renderWeek();show('week')};
window.addEventListener('resize',()=>{if(!$('s1').hidden)layoutWheel();if(!$('s2').hidden)layoutTags();if(!$('s3').hidden)layoutDial()});
renderHome();show('home');
</script>
